apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: example-applicationset
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/Tanmaykaturi/argo-practice
        revision: main
        directories:
          - path: service
  template:
    metadata:
      name: '{{path.basename}}-app'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/Tanmaykaturi/argo-practice
        targetRevision: 'main'
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
