apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Tanmaykaturi/argo-practice'
    targetRevision: HEAD
    path: 'k8s-manifests'  # Path to your Kubernetes manifests in the repo
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default  # Namespace to deploy your application
  syncPolicy:
    automated:
      prune: true  # Automatically remove resources no longer defined in the Git repo
      selfHeal: true  # Automatically sync the app if there's drift
