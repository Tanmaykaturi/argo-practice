apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Tanmaykaturi/argo-practice  # Replace with your Git repository URL
    targetRevision: HEAD  # Replace with the desired branch/tag/commit
    path: applications # Path to the folder containing Deployment and Service YAML files
  destination:
    server: https://kubernetes.default.svc  # Target cluster (same cluster if ArgoCD is in the same one)
    namespace: default  # The namespace to deploy to
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
